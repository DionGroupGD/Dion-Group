*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px 16px;-webkit-font-smoothing:antialiased}

form{width:100%;display:flex;gap:8px;margin-top:8px}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:13px 20px;outline:none}
input:focus{border-color:var(--ink)}
button{font:inherit;font-weight:600;color:var(--cream);background:var(--ink);border:0;border-radius:999px;padding:13px 24px;cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
.err{margin:0;color:var(--err);font-size:14px}
.by{margin:22px 0 0;font-size:13px;color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
