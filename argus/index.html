<!DOCTYPE html>
<html lang="el" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Argus — Live Data Boards for Excel &amp; ERP | Dion Group</title>
<meta name="description" content="Argus turns an Excel or ERP export into a boardroom-ready dashboard and an always-on wallboard. Drop a file, get a live view. Your data never leaves the browser. By Dion Group.">
<meta name="robots" content="noindex, follow">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000">

<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gfont" rel="stylesheet" media="print" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"></noscript>

<link rel="stylesheet" href="argus.css">
</head>
<body data-mode="studio">

<main id="ax-app" class="ax-app"></main>

<div id="ax-flash" class="ax-flash" role="status" aria-live="polite"></div>

<div class="ax-dropveil" aria-hidden="true">
  <div class="ax-dropveil-inner">Αφήστε το αρχείο εδώ</div>
</div>

<dialog id="ax-editor" class="ax-dialog"></dialog>

<input id="ax-file" class="ax-hidden-input" type="file" accept=".csv,.tsv,.txt,.json,.xlsx,.xlsm,.xltx" multiple aria-hidden="true" tabindex="-1">
<input id="ax-workspace-file" class="ax-hidden-input" type="file" accept=".json" aria-hidden="true" tabindex="-1">

<noscript>
  <div class="ax-noscript">Το Argus χρειάζεται JavaScript. Ενεργοποιήστε το και ανανεώστε τη σελίδα.</div>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
