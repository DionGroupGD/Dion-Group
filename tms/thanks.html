<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="Thanks — your Axon TMS request was received. We reply by email within one business day.">
<meta name="robots" content="noindex, follow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4eef4">
<link rel="icon" type="image/x-icon" href="../favicon.ico?v=6">
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=6">

<link rel="manifest" href="../site.webmanifest?v=6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="axon.css?v=22">
<style>
  :root{ --surface:rgba(255,255,255,.62); --surface-line:rgba(255,255,255,.72); --r-xl:28px; --shadow-lg:0 24px 64px rgba(28,30,68,.12); --green-bg:#d8f1e1; --green:#15894a; --blue:#0a74f0; --gray-600:#5f6573; --gray-500:#7c828f; --gray-300:#c4c8d0; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; padding:.85rem 1.6rem; border-radius:999px; background:#1b1d27; color:#fff; font-weight:600; font-size:.98rem; transition:transform .2s,box-shadow .2s; box-shadow:0 14px 34px rgba(28,30,68,.18); }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 20px 44px rgba(28,30,68,.26); }
  .btn.ghost{ background:rgba(255,255,255,.7); color:#16181f; border:1px solid rgba(28,30,45,.1); box-shadow:none; }
  .btn.ghost:hover{ background:#fff; }
  .ty-wrap{ min-height:100vh; display:grid; place-items:center; padding:40px 20px; }
  .ty-card{ max-width:560px; width:100%; text-align:center; background:var(--surface); border:1px solid var(--surface-line); border-radius:var(--r-xl); padding:clamp(34px,6vw,56px); box-shadow:var(--shadow-lg); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); }
  .ty-check{ width:74px; height:74px; border-radius:50%; margin:0 auto 24px; display:grid; place-items:center; background:var(--green-bg); color:var(--green); box-shadow:0 8px 24px rgba(43,189,110,0.25); }
  .ty-check svg{ width:36px; height:36px; }
  .ty-eyebrow{ display:inline-block; font-size:0.74rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--blue); margin-bottom:14px; }
  .ty-h{ font-size:clamp(1.9rem,4vw,2.6rem); font-weight:800; letter-spacing:-0.03em; line-height:1.1; margin-bottom:14px; }
  .ty-p{ font-size:1.05rem; color:var(--gray-600); line-height:1.6; margin-bottom:28px; }
  .ty-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .ty-brand{ display:inline-flex; align-items:center; gap:9px; margin-bottom:26px; font-weight:700; letter-spacing:-0.01em; }
  .ty-brand img{ width:28px; height:28px; border-radius:8px; }
  .ty-brand .sep{ color:var(--gray-300); font-weight:300; }
  .ty-brand .dg{ color:var(--gray-500); font-weight:500; }
</style>
</head>
<body
  data-title-en="Thank you Axon TMS | Dion Group"
  data-title-de="Danke Axon TMS | Dion Group"
  data-title-gr="Ευχαριστούμε Axon TMS | Dion Group">
  <main class="ty-wrap">
    <div class="ty-card">
      <a href="axon.html#top" class="ty-brand" aria-label="Axon — Dion Group">
        <img src="assets/axon-tile.png" alt="" width="28" height="28"><span>Axon</span><span class="sep">|</span><span class="dg">Dion Group</span>
      </a>
      <div class="ty-check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <span class="ty-eyebrow" data-en="Request received" data-de="Anfrage erhalten" data-gr="Το αίτημα ελήφθη">Request received</span>
      <h1 class="ty-h" data-en="Thanks. Your plan is on the way." data-de="Danke. Ihr Plan ist unterwegs." data-gr="Ευχαριστούμε. Το πλάνο σας έρχεται.">Thanks. Your plan is on the way.</h1>
      <p class="ty-p" data-en="We have your details and a confirmation is in your inbox. Our team will send a tailored plan by email within one business day. No sales call unless you ask." data-de="Wir haben Ihre Angaben und eine Bestätigung liegt in Ihrem Posteingang. Unser Team sendet innerhalb eines Werktags einen maßgeschneiderten Plan per E Mail. Kein Verkaufsanruf, außer Sie wünschen es." data-gr="Έχουμε τα στοιχεία σας και μια επιβεβαίωση βρίσκεται στο email σας. Η ομάδα μας θα στείλει εξατομικευμένο πλάνο εντός μίας εργάσιμης. Καμία κλήση πώλησης χωρίς να το ζητήσετε.">We have your details and a confirmation is in your inbox. Our team will send a tailored plan by email within one business day. No sales call unless you ask.</p>
      <div class="ty-row">
        <a href="axon.html#how" class="btn" data-en="Back to Axon" data-de="Zurück zu Axon" data-gr="Πίσω στο Axon">Back to Axon</a>
        <a href="../index.html" class="btn ghost" data-en="Visit Dion Group" data-de="Dion Group besuchen" data-gr="Επισκεφθείτε το Dion Group">Visit Dion Group</a>
      </div>
    </div>
  </main>
  <script defer src="../app.js?v=2"></script>
</body>
</html>
