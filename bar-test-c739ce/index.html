<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Bar tests</title><style>:root{--bg:#e5dcd0;--dark:#1d1713;--ink:#211a15;--cream:#efe7dc}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font:400 17px/1.45 -apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.s{position:relative;height:170vh;background:var(--bg)}
.s.d{background:var(--dark);color:var(--cream)}
.in{height:100svh;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:0 28px}
.in h1{font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-.02em}
.in p{max-width:30ch;opacity:.75}
.in a.next{margin-top:14px;height:48px;padding:0 24px;border-radius:99px;display:inline-flex;align-items:center;background:var(--cream);color:var(--dark);text-decoration:none;font-weight:600}
header{left:0;right:0;top:0;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:30;color:#8a7f73}
header b{font-weight:600}
header span{height:38px;padding:0 16px;border-radius:99px;display:inline-flex;align-items:center;background:#8a7f73;color:var(--bg);font-size:14px}</style></head>
<body><section class="s" style="height:100svh"><div class="in"><h1>Three quick tests</h1><p>Each page scrolls from beige into dark. In each one, stop when the dark part fills the screen and take a screenshot. Then tap Next test.</p><a class="next" href="1.html" style="background:var(--ink);color:var(--bg)">Start</a></div></section></body></html>
