<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#e5dcd0">
<title>Bar test 2 of 3</title>
<style>:root{--bg:#e5dcd0;--dark:#1d1713;--ink:#211a15;--cream:#efe7dc}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font:400 17px/1.45 -apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.s{position:relative;height:170vh;background:var(--bg)}
.s.d{background:var(--dark);color:var(--cream)}
.in{height:100svh;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:0 28px}
.in h1{font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-.02em}
.in p{max-width:30ch;opacity:.75}
.in a.next{margin-top:14px;height:48px;padding:0 24px;border-radius:99px;display:inline-flex;align-items:center;background:var(--cream);color:var(--dark);text-decoration:none;font-weight:600}
header{left:0;right:0;top:0;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:30;color:#8a7f73}
header b{font-weight:600}
header span{height:38px;padding:0 16px;border-radius:99px;display:inline-flex;align-items:center;background:#8a7f73;color:var(--bg);font-size:14px}
header{position:fixed}.in{position:sticky;top:0}header,.in{pointer-events:none}header span,.in a{pointer-events:auto}</style></head>
<body>
<header><b>Bar test 2 of 3</b><span>Button</span></header>
<section class="s"><div class="in"><h1>Test 2 of 3</h1><p>Pinned, but see-through. Scroll down slowly until the dark part fills the screen.</p></div></section>
<section class="s d"><div class="in"><h1>Stop here and take a screenshot</h1><p>Look at the strip behind the clock and the bar at the bottom.</p><a class="next" href="3.html">Next test</a></div></section>
<section class="s"><div class="in"><p>Scroll back up to the dark part for the screenshot.</p></div></section>
</body></html>
