<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">

<style>html,body{height:100%;margin:0;background:#e5dcd0;color:#211a15;font:400 17px/1.45 -apple-system,system-ui,sans-serif}body{display:grid;place-items:center;text-align:center;padding:0 28px}button{margin-top:16px;height:48px;padding:0 26px;border:0;border-radius:99px;background:#211a15;color:#e5dcd0;font:600 16px -apple-system,system-ui,sans-serif}</style></head>
<body><div><h1 style="font-size:30px;margin:0">Test 5</h1><p>A lock screen like the preview's. Tap Open, then scroll into the dark part and take a screenshot.</p><button id="go" type="button">Open</button></div>
<script>const PAGE = "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<meta name=\"robots\" content=\"noindex,nofollow\">\n<meta name=\"theme-color\" content=\"#e5dcd0\">\n<title>Bar test 5</title>\n<style>:root{--bg:#e5dcd0;--dark:#1d1713;--ink:#211a15;--cream:#efe7dc}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{background:var(--bg)}\nbody{color:var(--ink);font:400 17px/1.45 -apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}\n.s{position:relative;height:170vh;background:var(--bg)}\n.s.d{background:var(--dark);color:var(--cream)}\n.in{height:100svh;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:0 28px}\n.in h1{font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-.02em}\n.in p{max-width:30ch;opacity:.75}\n.in a.next{margin-top:14px;height:48px;padding:0 24px;border-radius:99px;display:inline-flex;align-items:center;background:var(--cream);color:var(--dark);text-decoration:none;font-weight:600}\nheader{left:0;right:0;top:0;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:30;color:#8a7f73}\nheader b{font-weight:600}\nheader span{height:38px;padding:0 16px;border-radius:99px;display:inline-flex;align-items:center;background:#8a7f73;color:var(--bg);font-size:14px}\nheader{position:fixed}.in{position:sticky;top:0}header,.in{pointer-events:none}.in a{pointer-events:auto}\n</style></head>\n<body>\n<header><b>Bar test 5</b></header>\n<section class=\"s\"><div class=\"in\"><h1>Test 5</h1><p>Opened through a lock screen, like the preview. Scroll down slowly until the dark part fills the screen.</p></div></section>\n<section class=\"s d\"><div class=\"in\"><h1>Stop here and take a screenshot</h1><p>Look at the strip behind the clock and the bar at the bottom.</p><p><b>That was the last one. Thank you!</b></p></div></section>\n<section class=\"s\"><div class=\"in\"><p>Scroll back up to the dark part for the screenshot.</p></div></section>\n</body></html>\n";document.getElementById('go').addEventListener('click', () => { document.open(); document.write(PAGE); document.close(); });</script>
</body></html>
